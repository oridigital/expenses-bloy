<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="הוצאות" />
  <meta name="theme-color" content="#E65C00" />
  <title>מנהל הוצאות</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f2f2f7; color: #111; }
    .app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 480px; margin: 0 auto; background: #f2f2f7; }

    .topbar { background: #fff; padding: max(env(safe-area-inset-top), 14px) 16px 14px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .app-title { font-size: 20px; font-weight: 700; color: #111; }
    .total-chip { font-size: 14px; font-weight: 600; padding: 6px 16px; border-radius: 20px; background: #E65C00; color: #fff; }

    .add-card { margin: 14px 14px 0; background: #fff; border-radius: 16px; border: 1px solid #e8e8e8; padding: 16px; }
    .add-label { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 10px; letter-spacing: .04em; }
    .add-row { display: flex; gap: 8px; align-items: center; }
    .desc-input { flex: 1; padding: 11px 14px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 15px; background: #f9f9f9; color: #111; outline: none; font-family: inherit; direction: rtl; min-width: 0; transition: border-color .2s; }
    .desc-input:focus { border-color: #E65C00; background: #fff; }
    .amount-input { width: 90px; padding: 11px 10px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 15px; background: #f9f9f9; color: #111; outline: none; font-family: inherit; text-align: center; transition: border-color .2s; }
    .amount-input:focus { border-color: #E65C00; background: #fff; }
    .add-btn { width: 44px; height: 44px; border-radius: 50%; background: #E65C00; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .15s, transform .1s; }
    .add-btn:active { opacity: .8; transform: scale(.95); }
    .add-btn svg { width: 22px; height: 22px; fill: #fff; }
    .cat-hint { margin-top: 9px; font-size: 13px; color: #999; min-height: 20px; display: flex; align-items: center; gap: 5px; transition: color .2s; }
    .cat-hint.detected { color: #E65C00; font-weight: 600; }

    .cats-section { padding: 16px 14px 20px; }
    .section-label { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 12px; letter-spacing: .04em; }
    .cats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cat-card { background: #fff; border: 1px solid #ebebeb; border-radius: 16px; padding: 14px; cursor: pointer; transition: transform .15s, border-color .15s; user-select: none; }
    .cat-card:active { transform: scale(.97); }
    .cat-card.has-items { border-color: #ddd; }
    .cat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cat-icon-wrap { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .cat-total { font-size: 16px; font-weight: 700; color: #111; }
    .cat-name { font-size: 14px; font-weight: 600; color: #333; }
    .cat-count { font-size: 12px; color: #aaa; margin-top: 3px; }

    .detail-view { display: none; flex-direction: column; min-height: 100dvh; background: #f2f2f7; }
    .detail-view.open { display: flex; }
    .detail-header { background: #fff; padding: max(env(safe-area-inset-top), 14px) 16px 14px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .back-btn { background: none; border: none; cursor: pointer; color: #E65C00; padding: 4px; display: flex; align-items: center; font-size: 15px; font-family: inherit; font-weight: 600; gap: 4px; }
    .detail-title { font-size: 17px; font-weight: 700; color: #111; flex: 1; }
    .detail-total { font-size: 15px; font-weight: 700; color: #E65C00; }
    .detail-list { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .exp-item { background: #fff; border: 1px solid #ebebeb; border-radius: 14px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; }
    .exp-info { flex: 1; min-width: 0; }
    .exp-name { font-size: 15px; color: #111; font-weight: 500; }
    .exp-date { font-size: 12px; color: #aaa; margin-top: 2px; }
    .exp-amt { font-size: 16px; font-weight: 700; color: #111; white-space: nowrap; }
    .del-btn { background: none; border: none; cursor: pointer; color: #ccc; padding: 6px; border-radius: 8px; font-size: 18px; transition: color .15s; display: flex; align-items: center; }
    .del-btn:active { color: #e24b4a; }
    .empty-cat { text-align: center; padding: 40px 20px; color: #bbb; font-size: 15px; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 9px 20px; border-radius: 22px; font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="app" id="main-view">
  <div class="topbar">
    <span class="app-title">💰 הוצאות</span>
    <span class="total-chip" id="total-chip">₪0</span>
  </div>

  <div class="add-card">
    <div class="add-label">הוספת הוצאה</div>
    <div class="add-row">

      <input class="amount-input" id="amt" type="number" placeholder="₪" />
      <button class="add-btn" onclick="addExpense()" aria-label="הוסף">
        <svg viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
      </button>
    </div>
    <div class="cat-hint" id="cat-hint">הקלד תיאור לזיהוי קטגוריה אוטומטי</div>
  </div>

  <div class="cats-section">
    <div class="section-label">קטגוריות</div>
    <div class="cats-grid" id="cats-grid"></div>
  </div>
</div>

<div class="detail-view" id="detail-view">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetail()">&#8594; חזור</button>
    <span class="detail-title" id="detail-title"></span>
    <span class="detail-total" id="detail-total"></span>
  </div>
  <div class="detail-list" id="detail-list"></div>
</div>

<div class="toast" id="toast"></div>

let expenses = JSON.parse(localStorage.getItem('exp_v4') || '[]');
let openCat = null;

function save() { try { localStorage.setItem('exp_v4', JSON.stringify(expenses)); } catch(e){} }

function detectCat(t) {
  const l = t.toLowerCase().trim();
  // split into words for exact word matching on short keywords
  const words = l.split(/\s+/);
  for (const c of CATS) {
    if (c.key === 'other') continue;
    if (c.kw.some(k => {
      const kl = k.toLowerCase();
      // if keyword has spaces, use substring match; otherwise also check word boundary
      if (kl.includes(' ')) return l.includes(kl);
      return l.includes(kl);
    })) return c;
  }
  return CATS[CATS.length - 1];
}

function onDesc() {
  const v = document.getElementById('desc').value.trim();
  const hint = document.getElementById('cat-hint');
  if (v.length > 1) {
    const c = detectCat(v);
    hint.className = 'cat-hint detected';
    hint.textContent = c.icon + ' ' + c.label;
  } else {
    hint.className = 'cat-hint';
    hint.textContent = 'הקלד תיאור לזיהוי קטגוריה אוטומטי';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function addExpense() {
  const desc = document.getElementById('desc').value.trim();
  const amt = parseFloat(document.getElementById('amt').value);
  if (!desc || isNaN(amt) || amt <= 0) {
    document.getElementById('desc').style.borderColor = '#e24b4a';
    setTimeout(() => document.getElementById('desc').style.borderColor = '', 1200);
    return;
  }
  const cat = detectCat(desc);
  expenses.unshift({ id: Date.now(), desc, amount: amt, catKey: cat.key, date: new Date().toLocaleDateString('he-IL') });
  save();
  document.getElementById('desc').value = '';
  document.getElementById('amt').value = '';
  document.getElementById('cat-hint').className = 'cat-hint';
  document.getElementById('cat-hint').textContent = 'הקלד תיאור לזיהוי קטגוריה אוטומטי';
  showToast('✓ נוסף ל' + cat.label);
  renderGrid();
}

function renderGrid() {
  const total = expenses.reduce((s, e) => s + e.amount, 0);
  document.getElementById('total-chip').textContent = '₪' + Math.round(total).toLocaleString('he-IL');
  const grid = document.getElementById('cats-grid');
  grid.innerHTML = '';
  CATS.forEach(cat => {
    const items = expenses.filter(e => e.catKey === cat.key);
    const sum = items.reduce((s, e) => s + e.amount, 0);
    const card = document.createElement('div');
    card.className = 'cat-card' + (items.length ? ' has-items' : '');
    card.onclick = () => openDetail(cat.key);
    card.innerHTML = `
      <div class="cat-top">
        <div class="cat-icon-wrap" style="background:${cat.bg}">${cat.icon}</div>
        <div class="cat-total">${items.length ? '₪' + Math.round(sum).toLocaleString('he-IL') : ''}</div>
      </div>
      <div class="cat-name">${cat.label}</div>
      <div class="cat-count">${items.length ? items.length + ' הוצאות' : 'ריק'}</div>
    `;
    grid.appendChild(card);
  });
}

function openDetail(key) {
  openCat = key;
  const cat = CATS.find(c => c.key === key);
  const items = expenses.filter(e => e.catKey === key);
  const sum = items.reduce((s, e) => s + e.amount, 0);
  document.getElementById('detail-title').textContent = cat.icon + ' ' + cat.label;
  document.getElementById('detail-total').textContent = items.length ? '₪' + Math.round(sum).toLocaleString('he-IL') : '';
  const list = document.getElementById('detail-list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="empty-cat">אין עדיין הוצאות בקטגוריה זו 😊</div>';
  } else {
    items.forEach(exp => {
      const el = document.createElement('div');
      el.className = 'exp-item'; el.id = 'exp-' + exp.id;
      el.innerHTML = `
        <div class="exp-info">
          <div class="exp-name">${exp.desc}</div>
          <div class="exp-date">${exp.date}</div>
        </div>
        <div class="exp-amt">₪${Math.round(exp.amount).toLocaleString('he-IL')}</div>
        <button class="del-btn" onclick="deleteExp(${exp.id})" aria-label="מחק">✕</button>
      `;
      list.appendChild(el);
    });
  }
  document.getElementById('main-view').style.display = 'none';
  document.getElementById('detail-view').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-view').classList.remove('open');
